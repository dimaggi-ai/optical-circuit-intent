name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Test suite, including the mutation tests
        run: PYTHONPATH=src:validation python -m pytest tests/ -q
      - name: Validation registry, and what it declines
        run: python validation/validate_intent.py
      - name: Every example input reaches its documented result
        run: python examples/run_examples.py
      - name: The three quoted figures reproduce
        run: |
          PYTHONPATH=src python experiments/retune_disagreement.py
          PYTHONPATH=src python experiments/checkpoint_crossover.py
          PYTHONPATH=src python experiments/stranded_ports.py
      - name: The installed console script works
        run: |
          ocintent --version
          ocintent ladder
          ocintent example circuit > /tmp/circuit.json
          ocintent drift /tmp/circuit.json || test $? -eq 1
