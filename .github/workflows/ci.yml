name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Fetch and SHA-verify the HEDGE testbed files
        # three attempts: the files come from raw.githubusercontent.com, and a
        # transient fetch failure must not read as a broken registry
        run: |
          for attempt in 1 2 3; do
            PYTHONPATH=src python data/hedge/fetch_hedge.py && exit 0
            echo "fetch attempt $attempt failed" >&2
            sleep 20
          done
          exit 1
      - name: Test suite, including the mutation tests
        run: PYTHONPATH=src:validation python -m pytest tests/ -q
      - name: Validation registry, and what it declines
        run: python validation/validate_intent.py
      - name: Every example input reaches its documented result
        run: python examples/run_examples.py
      - name: The four quoted figures reproduce
        run: |
          PYTHONPATH=src python experiments/retune_disagreement.py
          PYTHONPATH=src python experiments/checkpoint_crossover.py
          PYTHONPATH=src python experiments/stranded_ports.py
          PYTHONPATH=src python experiments/measured_lead_time.py
      - name: The installed console script works
        run: |
          ocintent --version
          ocintent ladder
          ocintent example circuit > /tmp/circuit.json
          ocintent drift /tmp/circuit.json || test $? -eq 1
          ocintent hedge --run wdl
          ocintent hedge --data /tmp/no-such-data || test $? -eq 2
